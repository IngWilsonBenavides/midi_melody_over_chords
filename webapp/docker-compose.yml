version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# MIDI Melody Curator — Docker Compose
#
# Usage:
#   cp .env.example .env   # edit passwords as needed
#   docker compose up -d
#
# Services:
#   db        – PostgreSQL 15
#   pgadmin   – pgAdmin 4  (http://localhost:5050)
#   backend   – Django + DRF (http://localhost:8000)
#   frontend  – React/Vite dev server (http://localhost:5173)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-midi_curator}
      POSTGRES_USER:     ${POSTGRES_USER:-midi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midi_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-midi_user} -d ${POSTGRES_DB:-midi_curator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin 4 ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Django backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL:              postgresql://${POSTGRES_USER:-midi_user}:${POSTGRES_PASSWORD:-midi_pass}@db:5432/${POSTGRES_DB:-midi_curator}
      SECRET_KEY:                ${SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG:                     ${DEBUG:-true}
      ALLOWED_HOSTS:             ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS:      ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MIDI_MEDIA_ROOT:           /media/midis
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      DJANGO_SUPERUSER_EMAIL:    ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    volumes:
      - ./backend:/app              # live-reload in dev
      - ./media/midis:/media/midis  # bind-mount: drop .mid files here on host
    entrypoint: ["/app/entrypoint.sh"]
    command: python manage.py runserver 0.0.0.0:8000

  # ── React / Vite frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite proxies /api → backend; no browser env var needed for base URL
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app             # live-reload in dev
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  pgadmin_data:
  frontend_node_modules:
