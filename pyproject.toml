[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dictados"
version = "0.1.0"
description = "Melodic dictation generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "mido>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev  = [
  "pytest>=7.0",
  "ruff>=0.4",
  "mypy>=1.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
